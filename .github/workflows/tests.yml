name: Tests

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: measure
          - group: protein
          - group: rest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v7

      - name: Set up conda
        env:
          KEY_MODELLER : ${{ secrets.KEY_MODELLER }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: resdy_test
          environment-file: .github/test_environment.yml
          conda-solver: libmamba
          channels: conda-forge,salilab
          conda-remove-defaults: 'true'
          channel-priority: strict
          auto-update-conda: false
          remove-profiles: true
          run-post: true

      - name: Test Measure
        timeout-minutes: 15
        if: matrix.group == 'measure'
        run: |
          python test/test_measure.py

      - name: Test Protein
        timeout-minutes: 15
        if: matrix.group == 'protein'
        run: |
          python test/test_protein.py
      - name: Test Patcher
        timeout-minutes: 10
        if: ${{ matrix.group == 'protein' && !cancelled() }}
        run: |
          python test/test_patcher.py

      - name: Test Uniprot
        timeout-minutes: 10
        if: matrix.group == 'rest'
        run: |
          python test/test_uniprot.py
      - name: Test Alphafold
        timeout-minutes: 10
        if: ${{ matrix.group == 'rest' && !cancelled() }}
        run: |
          python test/test_alphafold.py
      - name: Test Helper
        timeout-minutes: 5
        if: ${{ matrix.group == 'rest' && !cancelled() }}
        run: |
          python test/test_helper.py
      - name: Test Residues
        timeout-minutes: 5
        if: ${{ matrix.group == 'rest' && !cancelled() }}
        run: |
          python test/test_residues.py
      - name: Test Aggregation
        timeout-minutes: 10
        if: ${{ matrix.group == 'rest' && !cancelled() }}
        run: |
          python test/test_aggregate.py
      - name: Test Analysis
        timeout-minutes: 10
        if: ${{ matrix.group == 'rest' && !cancelled() }}
        run: |
          python test/test_analysis.py
      - name: Test Geometry
        timeout-minutes: 5
        if: ${{ matrix.group == 'rest' && !cancelled() }}
        run: |
          python test/test_geometry.py
      - name: Test Assembly
        timeout-minutes: 5
        if: ${{ matrix.group == 'rest' && !cancelled() }}
        run: |
          python test/test_assembly.py
