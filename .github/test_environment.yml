name: resdy_test
channels:
  - conda-forge
  - salilab
dependencies:
  - python=3.12
  - pip
  - biobox>=1.1.5
  - biopython
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - Modeller
  - propka
  - statsmodels
  - frustratometer
  - ase
  - pytorch
  - torchani
  - openmm
  - pdbfixer
  - msms
  - mdtraj
  # melodia-py imports nglview at module load but does not declare it as a
  # dependency, so removing it silently disables the melodia feature.
  - nglview
  - numba
  - python-dotenv
  - scikit-learn
  - scipy
  - requests
  - plotly
  - dash
  - pip:
    - melodia-py==0.1.8
    - fair-esm
