name: resdy_test
channels:
  - conda-forge
  - salilab
dependencies:
  - python=3.12
  - pip
  - biobox
  - biopython
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - Modeller
  - propka
  # analysis.enrichment_analysis raises ImportError without statsmodels
  - statsmodels
  - frustratometer
  - ase
  - pytorch
  - torchani
  - openmm
  - pdbfixer
  - msms
  - mdtraj
  # melodia-py imports nglview at module load but does not declare it as a
  # dependency, so removing it silently disables the melodia feature.
  - nglview
  - numba
  - python-dotenv
  - pip:
    - melodia-py==0.1.8
    - fair-esm
