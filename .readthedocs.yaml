# Read the Docs build configuration for the RESDY documentation.
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  # Several docstrings still carry unfinished ".. todo::" notes and other minor
  # markup issues, so warnings are not promoted to build failures for now.
  fail_on_warning: false

# The package is not installed: docs/source/conf.py puts "src" on sys.path, and the
# third-party packages that autodoc cannot do without are listed in the requirements
# file below. Everything else (biobox, Modeller, openmm, the feature back ends, the
# viewer stack) is mocked in conf.py, so it does not have to be installed here.
python:
  install:
    - requirements: docs/requirements.txt
